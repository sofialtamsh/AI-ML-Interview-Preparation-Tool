# Local development infrastructure. Application processes (API, worker, frontend)
# run on the host during development; see README.md.
name: ipp

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ipp
      POSTGRES_PASSWORD: ipp
      POSTGRES_DB: ipp
    ports:
      # A high host port avoids clashing with other local Postgres installs (5432/5433).
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ipp -d ipp"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
